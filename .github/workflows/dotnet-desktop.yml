name: XMAT Win64 Desktop Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: XboxMultiplayerAnalysisTool.sln
      EnableTelemetry: 'false'
      TelemetryApproved: 'false'

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    # Restore the solution
    - name: Restore the application
      run: dotnet restore $env:Solution_Name
      
    # Public CI must not restore/activate internal telemetry, regardless of saved user consent.
    - name: Build XMAT
      run: dotnet build $env:Solution_Name -c $env:Configuration --no-restore -p:EnableTelemetry=false -p:TelemetryApproved=false
      env:
        Configuration: ${{ matrix.configuration }}

    # Run tests with code coverage
    - name: Run Tests with Coverage
      run: >-
        dotnet test $env:Solution_Name
        -c $env:Configuration
        --no-build
        --verbosity normal
        --logger "trx;LogFileName=test-results.trx"
        --collect:"XPlat Code Coverage"
        --results-directory ./TestResults
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Verify telemetry build gates
      shell: pwsh
      run: |
        $base = @('XMAT\XboxMultiplayerAnalysisTool.csproj', '-t:ValidateTelemetryConfiguration', '-p:Platform=x64',
          '-p:EnableTelemetry=true', '-p:TelemetryBuildChannel=Test')
        $cases = @(
          @{ Args = @('-p:TelemetryApproved=false', '-p:BuildTelemetrySdk=true', '-p:TelemetryInstrumentationKey=test-key'); Error = 'TelemetryApproved=true' },
          @{ Args = @('-p:TelemetryApproved=true', '-p:BuildTelemetrySdk=true'); Error = 'valid TelemetryInstrumentationKey' },
          @{ Args = @('-p:TelemetryApproved=true', '-p:BuildTelemetrySdk=true', '-p:TelemetryInstrumentationKey=invalid'); Error = 'valid TelemetryInstrumentationKey' },
          @{ Args = @('-p:TelemetryApproved=true', '-p:BuildTelemetrySdk=false', '-p:TelemetryInstrumentationKey=test-key'); Error = 'BuildTelemetrySdk=true' },
          @{ Args = @('-p:TelemetryApproved=true', '-p:BuildTelemetrySdk=true', '-p:TelemetryInstrumentationKey=test-key', '-p:TelemetryBuildChannel=Local'); Error = 'TelemetryBuildChannel=Public' }
        )
        foreach ($case in $cases) {
          $output = dotnet msbuild @base @($case.Args) 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or -not $output.Contains($case.Error)) {
            throw "Telemetry build gate failed: $output"
          }
        }
        dotnet msbuild @base -p:TelemetryApproved=true -p:BuildTelemetrySdk=true -p:TelemetryInstrumentationKey=test-key
        if ($LASTEXITCODE -ne 0) { throw 'Approved telemetry build configuration was rejected.' }
        exit 0

    # Generate coverage report
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate Coverage Report
      run: >-
        reportgenerator
        "-reports:TestResults/**/coverage.cobertura.xml"
        "-targetdir:TestResults/CoverageReport"
        "-reporttypes:HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"
      
    - name: Post Coverage Summary
      if: always()
      run: |
        if (Test-Path "TestResults/CoverageReport/SummaryGithub.md") {
          Get-Content "TestResults/CoverageReport/SummaryGithub.md" >> $env:GITHUB_STEP_SUMMARY
        }

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: CoverageReport_${{ matrix.configuration }}
        path: TestResults/CoverageReport/

    # Ship the command line (xmat.exe) next to the GUI and check that it runs from the artifact folder
    - name: Add xmat.exe to the build artifact
      run: |
        $gui = "XMAT\bin\x64\$env:Configuration\net10.0-windows10.0.17763.0\win-x64"
        $cli = "XMAT.Cli\bin\x64\$env:Configuration\net10.0-windows10.0.17763.0\win-x64"
        foreach ($name in 'xmat.exe', 'xmat.dll', 'xmat.deps.json', 'xmat.runtimeconfig.json', 'xmat.pdb') {
          $source = Join-Path $cli $name
          if ($name -ne 'xmat.pdb' -or (Test-Path -LiteralPath $source)) {
            Copy-Item -LiteralPath $source -Destination $gui -ErrorAction Stop
          }
        }
        $xmat = Join-Path $gui 'xmat.exe'
        $version = (& $xmat --version) -join "`n" | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0 -or $version.schema -ne 'xmat-cli/1') { throw "xmat --version failed with exit code $LASTEXITCODE" }
        $doctor = (& $xmat doctor --for analyze) -join "`n" | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0 -or $doctor.status -ne 'succeeded') { throw "xmat doctor --for analyze failed with exit code $LASTEXITCODE" }
        Write-Host "xmat $($version.version) runs from the artifact folder"
      env:
        Configuration: ${{ matrix.configuration }}

    # Upload build artifact
    - name: Upload Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: XMAT_CI_Build_${{ env.Configuration }}
        path: XMAT\bin\x64\${{ env.Configuration }}\net10.0-windows10.0.17763.0\win-x64\
      env:
        Configuration: ${{ matrix.configuration }}
