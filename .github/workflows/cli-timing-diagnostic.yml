name: CLI timing investigation (temporary)
on:
  push:
    branches: [emily/investigate-cli-ci-timing]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [patched, baseline]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        dotnet-version: 10.0.x
    - name: Remove only timer fix for baseline comparison
      if: matrix.revision == 'baseline'
      run: git revert --no-commit 39ca7272db0b5634667c785d306e5453779a8580
    - name: Build Release (allow baseline CA2027 warnings)
      run: dotnet build XboxMultiplayerAnalysisTool.sln -c Release -p:Platform=x64 -p:WarningsNotAsErrors=CA2027
    - name: Capture tests with diagnostic timestamps
      run: >-
        dotnet test XMAT.Tests\XMAT.Tests.csproj -c Release -p:Platform=x64
        --no-build --no-restore
        --filter FullyQualifiedName~XmatCaptureTests
        --collect:"XPlat Code Coverage"
        --logger "console;verbosity=detailed"
        --logger "trx;LogFileName=cli-diagnostics.trx"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: cli-diagnostics-${{ matrix.revision }}
        path: XMAT.Tests/TestResults/
